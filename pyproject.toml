[project]
name = "harbor"
version = "0.1.0"
description = "A private, guarded coding box on rented compute"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "questionary>=2.1.1",
]

[project.scripts]
harbor = "harbor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor"]
